<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Afiliados Multiplataforma V5</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="app"><aside><div class="brand"><div class="brand-title">🤖 <b>BOT AFILIADOS</b></div><small>MULTIPLATAFORMA V5</small><div class="owner-brand"><span class="crown">♛</span><span>Desenvolvido por</span><strong>Gustavo Barbosa</strong><em>FOCO • ORGANIZAÇÃO • RESULTADOS</em></div></div><nav id="nav"></nav><div class="account"><div class="owner-mini">GB</div><b>Gustavo Barbosa</b><small>Dono do Bot</small><span>● CONTA ATIVA</span><small>V5.0 • Central Inteligente</small></div></aside><main><header><div class="search">🔎 <input id="globalSearch" placeholder="Buscar produto, categoria ou link..."></div><div class="status">🟢 Bot Online　🟠 Shopee　🟡 Mercado Livre</div></header><section id="view"></section></main></div><dialog id="editor"><form method="dialog" class="modal"><h2>Editar produto</h2><div class="formgrid"><label>Plataforma<select id="ePlatform"><option value="shopee">Shopee</option><option value="mercadolivre">Mercado Livre</option></select></label><label>Nome<input id="eName"></label><label>Categoria<select id="eCategory"><option>Geral</option><option>Eletrônicos</option><option>Ferramentas</option><option>Casa</option><option>Moda</option><option>Beleza</option><option>Automotivo</option><option>Games</option></select></label><label>Preço original<input id="eOldPrice" placeholder="R$ 299,90"></label><label>Preço promocional<input id="ePrice" placeholder="R$ 199,90"></label><label>Desconto %<input id="eDiscount" type="number" min="0" max="100"></label><label>Comissão estimada<input id="eCommission" placeholder="R$ 19,99"></label><label>Avaliação<input id="eRating" type="number" min="0" max="5" step="0.1"></label><label>Vendidos<input id="eSold" type="number" min="0"></label><label class="wide">URL da imagem<input id="eImage" placeholder="https://..."></label><label class="wide">Link afiliado<input id="eUrl"></label></div><div class="actions"><button value="cancel" class="ghost">Cancelar</button><button type="button" id="saveEdit" class="primary">Salvar produto</button></div></form></dialog><script src="js/app.js"></script></body></html>
