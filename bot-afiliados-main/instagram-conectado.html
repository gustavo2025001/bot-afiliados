<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Instagram conectado! | Bot Afiliados</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #f8fafc;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 76% 18%, rgba(126, 34, 206, .28), transparent 34%),
        radial-gradient(circle at 17% 78%, rgba(14, 165, 233, .20), transparent 32%),
        linear-gradient(135deg, #030712 0%, #071329 48%, #160c35 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .30;
      background-image:
        linear-gradient(rgba(56,189,248,.11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,.11) 1px, transparent 1px);
      background-size: 84px 84px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .city {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 25vh;
      opacity: .34;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          #07101f 0 8%, transparent 8% 12%,
          #07101f 12% 21%, transparent 21% 26%,
          #07101f 26% 34%, transparent 34% 39%,
          #07101f 39% 51%, transparent 51% 56%,
          #07101f 56% 67%, transparent 67% 72%,
          #07101f 72% 82%, transparent 82% 88%,
          #07101f 88% 100%);
      clip-path: polygon(
        0 48%, 8% 48%, 8% 26%, 12% 26%, 12% 58%, 21% 58%,
        21% 20%, 26% 20%, 26% 68%, 34% 68%, 34% 36%, 39% 36%,
        39% 12%, 51% 12%, 51% 62%, 56% 62%, 56% 30%, 67% 30%,
        67% 56%, 72% 56%, 72% 23%, 82% 23%, 82% 65%, 88% 65%,
        88% 40%, 100% 40%, 100% 100%, 0 100%
      );
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: min(680px, 100%);
    }

    .brand-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      font-weight: 900;
      letter-spacing: 1.4px;
    }

    .bot-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      font-size: 26px;
      background: linear-gradient(135deg, #38bdf8, #7c3aed 60%, #d946ef);
      box-shadow: 0 0 30px rgba(124,58,237,.35);
    }

    .brand-top small {
      display: block;
      margin-top: 4px;
      color: #94a3b8;
      font-size: 9px;
      letter-spacing: 3px;
    }

    .card {
      padding: 46px 38px 34px;
      text-align: center;
      border: 1px solid rgba(139,92,246,.62);
      border-radius: 28px;
      background: rgba(10, 19, 39, .93);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }

    .ig-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      font-size: 54px;
      font-weight: 900;
      background: linear-gradient(145deg, #7c3aed, #f000b8 45%, #ff7a00 76%, #ffd600);
      box-shadow: 0 16px 42px rgba(236,72,153,.30);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 48px);
      line-height: 1.05;
    }

    .message {
      margin: 22px auto 0;
      max-width: 550px;
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 16px;
    }

    .username {
      color: #c084fc;
      font-weight: 800;
    }

    .status {
      margin: 30px 0 22px;
      padding: 18px;
      border-radius: 16px;
      font-weight: 800;
    }

    .status.success {
      color: #5ee9a4;
      border: 1px solid rgba(16,185,129,.55);
      background: rgba(6,78,59,.28);
    }

    .status.error {
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,.55);
      background: rgba(127,29,29,.25);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 800;
      border: 1px solid #334155;
      background: #111c31;
    }

    .btn.primary {
      border: 0;
      background: linear-gradient(100deg, #4f65ff, #a226ff);
    }

    .signature {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(148,163,184,.15);
      color: #94a3b8;
      font-size: 10px;
      letter-spacing: 3px;
    }

    .signature strong {
      display: block;
      margin-bottom: 7px;
      color: #d8b4fe;
      font-size: 17px;
      letter-spacing: 1px;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .card { padding: 36px 20px 28px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="city"></div>

  <main class="wrap">
    <div class="brand-top">
      <div class="bot-icon">🤖</div>
      <div>
        BOT AFILIADOS
        <small>PREMIUM AUTOMATION</small>
      </div>
    </div>

    <section class="card">
      <div class="ig-icon" id="mainIcon">✓</div>

      <h1 id="title">Instagram conectado!</h1>

      <p class="message" id="message">
        Sua conta foi vinculada ao Bot Afiliados com sucesso.
      </p>

      <div class="status success" id="statusBox">
        ✓ Integração concluída com sucesso
      </div>

      <div class="actions">
        <a class="btn primary"
           href="https://gustavo2025001.github.io/bot-afiliados/">
          ← Voltar ao painel
        </a>

        <a class="btn"
           href="https://gustavo2025001.github.io/bot-afiliados/ofertas/">
          Ver minha vitrine
        </a>
      </div>

      <div class="signature">
        <strong>GustavoBarbosa</strong>
        CRIADO POR GUSTAVOBARBOSA
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get("status") || "success";
    const username = params.get("username") || "";
    const errorMessage = params.get("message") || "";

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const statusBox = document.getElementById("statusBox");
    const mainIcon = document.getElementById("mainIcon");

    if (status === "error") {
      document.title = "Erro ao conectar Instagram | Bot Afiliados";
      mainIcon.textContent = "!";
      title.textContent = "Erro ao conectar Instagram";
      message.textContent =
        errorMessage ||
        "Não foi possível concluir a integração. Volte ao painel e tente novamente.";
      statusBox.className = "status error";
      statusBox.textContent = "Não foi possível concluir a integração";
    } else {
      const safeUsername = username ? "@" + username : "Instagram";
      title.textContent = "Instagram conectado!";
      message.innerHTML =
        'A conta <span class="username"></span> foi vinculada ao Bot Afiliados com sucesso. ' +
        'A conexão ficou associada ao usuário que autorizou o acesso.';
      message.querySelector(".username").textContent = safeUsername;
      statusBox.className = "status success";
      statusBox.textContent = "✓ Integração concluída com sucesso";
    }
  </script>
</body>
</html>
